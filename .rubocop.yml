plugins:
  - rubocop-rake
  - rubocop-rspec

AllCops:
  NewCops: enable
  TargetRubyVersion: 3.3
  Exclude:
    - "pkg/**/*"
    - "tmp/**/*"
    - "vendor/**/*"
  SuggestExtensions: false

Metrics/BlockLength:
  Exclude:
    - "spec/**/*"
    - "tsp_kit.gemspec"

Metrics/ModuleLength:
  Exclude:
    - "spec/**/*"

Style/Documentation:
  Enabled: false

# Native-extension setup uses mkmf's required global configuration variables.
Style/GlobalVars:
  Exclude:
    - "ext/tsp_kit/extconf.rb"

# These files intentionally reopen native classes to add cohesive Ruby behavior.
Style/OneClassPerFile:
  Exclude:
    - "lib/tsp_kit/marshal_support.rb"
    - "lib/tsp_kit/nodes.rb"
    - "lib/tsp_kit/tsplib_format.rb"

# Marshal is the explicit persistence format; callers must load trusted files only.
Security/MarshalLoad:
  Exclude:
    - "lib/tsp_kit/marshal_support.rb"

Metrics/AbcSize:
  Exclude:
    - "lib/tsp_kit/nodes.rb"

Metrics/CyclomaticComplexity:
  Exclude:
    - "lib/tsp_kit/nodes.rb"

Metrics/MethodLength:
  Exclude:
    - "lib/tsp_kit/tsplib_format.rb"

Naming/AccessorMethodName:
  Exclude:
    - "lib/tsp_kit/solver.rb"
    - "lib/tsp_kit/tsplib_format.rb"

Naming/MethodParameterName:
  AllowedNames:
    - h

Layout/LineLength:
  Exclude:
    - "spec/priority_queue_spec.rb"

# This file contains documentation-only declarations and is never required.
Lint/EmptyClass:
  Exclude:
    - "lib/tsp_kit/api_docs.rb"

# The recovered suite intentionally keeps related assertions together and uses
# named subjects heavily. Keep the RSpec plugin active while reflecting that
# established test structure.
RSpec/ExampleLength:
  Max: 35

RSpec/MultipleExpectations:
  Max: 12

RSpec/NamedSubject:
  Enabled: false

RSpec/NestedGroups:
  Max: 4

# The historical suite is flat rather than mirroring lib/tsp_kit/.
RSpec/SpecFilePathFormat:
  Enabled: false
